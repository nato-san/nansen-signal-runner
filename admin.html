<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read-only Nansen Runner dataset status." />
    <title>Nansen Runner Data Status</title>
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <span class="admin-kicker">NANSEN RUNNER</span>
          <h1>Data Status</h1>
        </div>
        <a href="/">ゲームへ戻る</a>
      </header>

      <div class="status-banner" id="freshness-banner">データを確認中...</div>

      <section class="metrics" aria-label="Dataset metrics">
        <article><span>収録期間</span><strong id="date-range">-</strong></article>
        <article><span>購入候補日</span><strong id="snapshot-dates">-</strong></article>
        <article><span>利用可能銘柄</span><strong id="eligible-tokens">-</strong></article>
        <article><span>データファイル</span><strong id="data-files">-</strong></article>
      </section>

      <section class="admin-section">
        <div class="section-heading">
          <h2>Pipeline</h2>
          <span class="readonly-badge">READ ONLY</span>
        </div>
        <dl class="status-list">
          <div><dt>最新更新</dt><dd id="generated-at">-</dd></div>
          <div><dt>対応チェーン</dt><dd id="chains">-</dd></div>
          <div><dt>履歴API成功記録</dt><dd id="historical-calls">-</dd></div>
          <div><dt>ライブ価格</dt><dd id="live-pricing">-</dd></div>
        </dl>
      </section>

      <section class="admin-section">
        <h2>Nansen Endpoints</h2>
        <code id="historical-endpoint">-</code>
        <code id="live-endpoint">-</code>
      </section>

      <footer>更新操作は管理者ターミナルからのみ実行されます。APIキーはブラウザへ送信されません。</footer>
    </main>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
